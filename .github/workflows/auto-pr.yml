name: Auto-open PR

# Opens a PR to main automatically for any pushed branch (other than main)
# that doesn't already have one open, so pushing a branch is enough - no
# need to click "Create pull request" by hand every time.

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Open a PR if one isn't already open
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="${GITHUB_REF#refs/heads/}"

          if ! git rev-parse --verify "origin/main" >/dev/null 2>&1; then
            echo "No origin/main to diff against, skipping."
            exit 0
          fi

          if [ -z "$(git log origin/main..HEAD --oneline)" ]; then
            echo "Branch has no commits ahead of main, skipping."
            exit 0
          fi

          existing="$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            echo "PR #$existing already open for $branch, skipping."
            exit 0
          fi

          gh pr create --base main --head "$branch" --title "$branch" --fill
