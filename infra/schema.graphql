## SEHATI-AI GraphQL schema (AppSync).
##
## Auth model: Amazon Cognito User Pools. Group-level authorization is enforced
## in the Lambda data layer (design doc section 10); the @aws_auth directives
## below are a coarse first gate. The rich PatientCase payload is returned as
## AWSJSON so the exact shape in src/types.ts is preserved end-to-end without
## re-declaring every nested field here.

schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}

## A full PatientCase document (see backend/sehati/models.py / src/types.ts).
scalar AWSJSON

type CaseResult {
  case: AWSJSON
}

type InterviewResult {
  case: AWSJSON
  aiMessage: AWSJSON
  complete: Boolean
}

type ChatResult {
  case: AWSJSON
  aiMessage: AWSJSON
}

type DiagnosisResult {
  case: AWSJSON
  diagnoses: AWSJSON
  tests: AWSJSON
}

type SummaryResult {
  case: AWSJSON
  summary: AWSJSON
}

type ExamsResult {
  case: AWSJSON
  exams: AWSJSON
}

type ExamResult {
  case: AWSJSON
  exam: AWSJSON
}

type TestResult {
  case: AWSJSON
  test: AWSJSON
}

type FinalDiagnosisResult {
  case: AWSJSON
  finalDiagnosis: AWSJSON
}

type FeedbackResult {
  case: AWSJSON
  accepted: Boolean
}

type Query {
  ## Clinical staff: whole tenant (optionally filtered). Patients: own cases only.
  listCases(status: String, mine: Boolean): AWSJSON
    @aws_auth(cognito_groups: ["patient", "physician", "admin", "compliance"])
  getCase(id: ID!): AWSJSON
    @aws_auth(cognito_groups: ["patient", "physician", "admin", "compliance"])
  ## Immutable audit trail — compliance / admin only.
  caseAudit(id: ID!): AWSJSON
    @aws_auth(cognito_groups: ["compliance", "admin"])
}

type Mutation {
  ## Intake + lifecycle
  submitIntake(input: AWSJSON!): AWSJSON
    @aws_auth(cognito_groups: ["patient", "physician", "admin"])
  setCaseState(caseId: ID!, state: String!, note: String): AWSJSON
    @aws_auth(cognito_groups: ["physician", "admin", "compliance"])
  addNote(caseId: ID!, text: String!): AWSJSON
    @aws_auth(cognito_groups: ["physician", "admin", "compliance"])

  ## AI interview (patient-facing path; no data-access tools)
  postInterviewMessage(caseId: ID!, text: String!): InterviewResult
    @aws_auth(cognito_groups: ["patient", "physician", "admin"])
  generateSummary(caseId: ID!): SummaryResult
    @aws_auth(cognito_groups: ["patient", "physician", "admin"])

  ## Examination
  recommendExams(caseId: ID!): ExamsResult
    @aws_auth(cognito_groups: ["physician", "admin", "compliance"])
  recordExamFinding(
    caseId: ID!
    examId: ID!
    finding: String
    normalRange: String
    flag: String
    note: String
    status: String
  ): ExamResult @aws_auth(cognito_groups: ["physician", "admin", "compliance"])

  ## Differential + explainability
  requestRecommendations(caseId: ID!): DiagnosisResult
    @aws_auth(cognito_groups: ["physician", "admin", "compliance"])
  askDiagnosis(caseId: ID!, question: String!, diagnosisId: ID): ChatResult
    @aws_auth(cognito_groups: ["physician", "admin", "compliance"])
  rerankAfterResults(caseId: ID!): DiagnosisResult
    @aws_auth(cognito_groups: ["physician", "admin", "compliance"])
  proposeFinalDiagnosis(caseId: ID!): FinalDiagnosisResult
    @aws_auth(cognito_groups: ["physician", "admin", "compliance"])
  acceptFinalDiagnosis(caseId: ID!, note: String): FinalDiagnosisResult
    @aws_auth(cognito_groups: ["physician", "admin"])

  ## Tests
  orderTest(caseId: ID!, testId: ID!): TestResult
    @aws_auth(cognito_groups: ["physician", "admin", "compliance"])
  recordTestResult(
    caseId: ID!
    testId: ID!
    result: String!
    resultFlag: String
    resultDetail: String
  ): TestResult @aws_auth(cognito_groups: ["physician", "admin", "compliance"])

  ## Collaboration + feedback flywheel
  assistantChat(caseId: ID!, text: String!): ChatResult
    @aws_auth(cognito_groups: ["physician", "admin", "compliance"])
  acceptRecommendation(
    caseId: ID!
    targetId: ID!
    targetType: String
    reason: String
  ): FeedbackResult @aws_auth(cognito_groups: ["physician", "admin", "compliance"])
  rejectRecommendation(
    caseId: ID!
    targetId: ID!
    targetType: String
    reason: String!
  ): FeedbackResult @aws_auth(cognito_groups: ["physician", "admin", "compliance"])

  ## Real-time fan-out triggers (invoked by the frontend after a mutation to
  ## notify other subscribers, or callable directly). Return the changed case.
  publishCaseUpdate(caseId: ID!, case: AWSJSON!): AWSJSON
    @aws_auth(cognito_groups: ["physician", "admin", "compliance"])
  publishMessage(caseId: ID!, message: AWSJSON!): AWSJSON
    @aws_auth(cognito_groups: ["patient", "physician", "admin", "compliance"])
}

type Subscription {
  ## Real-time case/state sync + chat streaming (design doc section 6.3).
  onCaseUpdated(caseId: ID!): AWSJSON
    @aws_subscribe(mutations: ["publishCaseUpdate"])
  onNewMessage(caseId: ID!): AWSJSON
    @aws_subscribe(mutations: ["publishMessage"])
}
